name: release

# Builds the Windows installers and attaches them to a DRAFT GitHub Release.
# Runs when a version tag is pushed (`npm run release -- 0.2.0` creates one),
# or by hand from the Actions tab (then only as downloadable artifacts).
# Review the draft on GitHub and press "Publish release" when it is good.
#
# More platforms later: add matrix entries (macos-latest with
# --target aarch64-apple-darwin / x86_64-apple-darwin, ubuntu-22.04 plus the
# webkit libraries); macOS minutes count 10x on private repos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the installers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run typecheck

      # a tag must match the app version, so a release can't ship the wrong number
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Gen1Recomp Studio ${{ github.ref_name }}
          releaseBody: See the changes since the previous release below.
          releaseDraft: true
          uploadWorkflowArtifacts: true
